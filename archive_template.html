<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23185FA5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='10'/%3E%3Cline x1='2' y1='12' x2='22' y2='12'/%3E%3Cpath d='M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z'/%3E%3C/svg%3E">
<title>{{MONTH_TITLE}} · 世界事件永久存档</title>
<link rel="stylesheet" href="./style.css">
<style>
  .month-nav{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
  .month-nav a{padding:6px 14px;border:1px solid var(--border);border-radius:20px;text-decoration:none;color:var(--text-primary);font-size:14px;transition:all .15s}
  .month-nav a:hover{border-color:var(--primary);color:var(--primary)}
  .month-nav a.current{background:var(--primary);color:#fff;border-color:var(--primary)}
</style>
</head>
<body>
<div class="container">
  <div class="page-header">
    <h1 class="page-title">{{MONTH_TITLE}}</h1>
    <p class="page-subtitle">月度归档 · 共 {{MONTH_COUNT}} 条 · 自动收集 · 永久存档</p>
  </div>

  <div class="month-nav">{{MONTH_NAV}}</div>

  <!-- 时间线列表 -->
  <div class="timeline" id="timeline-list">
<!-- TIMELINE_START -->
<!-- TIMELINE_END -->
  </div>

  <div class="month-nav" style="margin-top:24px">{{MONTH_NAV}}</div>

  <p style="text-align:center;margin:24px 0">
    <a href="./index.html" style="color:var(--primary);text-decoration:none">← 返回最新事件</a>
  </p>
</div>
<script>
/* 回到顶部（归档页为纯静态、不加载 app.js，故内置一份） */
(function () {
  var b = document.createElement('button');
  b.id = 'back-top'; b.className = 'back-top'; b.type = 'button';
  b.setAttribute('aria-label', '回到顶部'); b.title = '回到顶部';
  b.innerHTML = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="18 15 12 9 6 15"/></svg>';
  b.onclick = function () { window.scrollTo({ top: 0, behavior: 'smooth' }); };
  document.body.appendChild(b);
  var sync = function () { b.classList.toggle('show', window.scrollY > 400); };
  window.addEventListener('scroll', sync, { passive: true });
  sync();
})();
</script>
</body>
</html>
