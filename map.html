<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>世界地图 - 世界事件永久存档</title>
  <link rel="stylesheet" href="./style.css?v=4">
  <style>
    #map-echarts{width:100%;height:560px;border:1px solid var(--border);border-radius:12px;background:var(--bg-secondary, #f5f7fb)}
    .map-hint{color:var(--text-secondary);font-size:13px;margin:10px 0 0}
    .map-country-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:20px 0 8px}
    .map-country-bar h2{margin:0;font-size:20px}
    .map-country-bar .cnt{color:var(--text-secondary);font-size:13px}
    #map-events .evt-item{padding:10px 0;border-bottom:1px solid var(--border)}
    #map-events .evt-item a{font-weight:600;text-decoration:none;color:inherit}
    #map-events .evt-item a:hover{color:var(--primary,#2563eb)}
    #map-events .evt-meta{color:var(--text-secondary);font-size:12.5px;margin-top:2px}
  </style>
</head>
<body>

<!-- 导航栏 -->
<nav class="navbar">
  <div class="nav-inner">
    <a href="./index.html" class="nav-logo"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg> 全球大事记</a>
    <div class="nav-links">
      <a href="./index.html">今日世界</a>
      <a href="./map.html" class="active">世界地图</a>
      <a href="./country.html">地区档案</a>
      <a href="./admin.html">管理后台</a>
    </div>
  </div>
</nav>

<div class="container">

  <!-- 页面标题 -->
  <div class="page-header">
    <h1 class="page-title">世界地图</h1>
    <p class="page-subtitle">点击国家查看该国发生的事件 · 颜色越深事件越多</p>
  </div>

  <!-- 地图容器 -->
  <div id="map-echarts"></div>
  <p class="map-hint"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg> 点击地图上的国家，下方将列出该国全部事件（含历史存档）。地图仅作国家位置示意，相关边界以国家主管部门审定的标准地图为准。</p>

  <!-- 选中国家的信息与事件列表 -->
  <div id="map-country-panel" style="display:none">
    <div class="map-country-bar">
      <h2 id="map-country-name"></h2>
      <span class="cnt" id="map-country-count"></span>
      <a href="javascript:void(0)" onclick="clearMapCountry()" style="font-size:13px;margin-left:auto"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> 显示全部国家</a>
    </div>
    <div class="timeline" id="map-events"></div>
  </div>

</div>

<!-- 页脚 -->
<div class="footer">
  全球大事记 · 数据永久存档
</div>

<script src="./assets/echarts.min.js"></script>
<!-- EMBED_EVENTS_START -->
<script src="./data/events.js"></script>
<!-- EMBED_EVENTS_END -->
<script>
  window.__INIT_PAGE__ = "map";
</script>
<script src="./app.js?v=7"></script>

</body>
</html>
