家庭造成不利影响，关税上调则带来成本和物价上涨压力。 根据美国“联邦储备法”，美国全国划分为12个联邦储备区，每区设立一家联邦储备银行。该报告根据12家联邦储备银行的最新调查结果编制而成，也称“褐皮书”。 报告显示，自4月下旬以来，美国经济活动整体出现小幅下降，半数联邦", "content": "新华社纽约6月4日电（记者刘亚南）美国联邦储备委员会4日发布的全国经济形势调查报告显示，美国经济和政策的不确定性处于高位，对企业和家庭造成不利影响，关税上调则带来成本和物价上涨压力。 根据美国“联邦储备法”，美国全国划分为12个联邦储备区，每区设立一家联邦储备银行。该报告根据12家联邦储备银行的最新调查结果编制而成，也称“褐皮书”。 报告显示，自4月下旬以来，美国经济活动整体出现小幅下降，半数联邦储备区经济活动出现轻微或温和下降。所有联邦储备区经济和政策不确定性均处于高位，导致企业和家庭决策变得迟疑和谨慎。制造业活动轻度下降。消费者支出情况混杂不一，大多数联邦储备区出现小幅下降或没有变化，但一些联邦储备区对预计受关税影响物品的支出增加。 报告说，整体而言，前景展望依然为轻度悲观和不确定，与前一次报告相比相对没有变化。 就业方面，大多联邦储备区就业状况与此前相比变化不大，但所有联邦储备区劳动力需求均有所下降，体现在工作时间和加班减少、招聘暂停和计划裁员等。 物价方面，4月下旬以来物价略有上涨。各联邦储备区内对成本和物价今后将以更快速度上涨的预期广泛存在。一些联邦储备区预计将出现显著或实质性成本增加。所有联邦储备区均报告，关税上调在给成本和物价带来上涨压力。 美联储每年发布8次“褐皮书”，通过联邦储备银行对全美经济形势进行摸底。该报告是美联储货币政策会议的重要参考资料。下一次美联储货币政策会议将于6月17日至18日举行。", "image": "", "videoUrl": "", "source": "人民网国际", "sourceUrl": "http://world.people.com.cn/n1/2025/0605/c1002-40494887.html", "tags": ["经济", "人民网国际"], "translated": false}, {"id": "EVT-880D4C80", "title": "商务部：中方对合规稀土出口许可申请将予以批准", "date": "2026-09-02", "category": "经济", "country": "中国", "region": "亚洲", "summary": "新华社北京6月5日电（记者谢希瑶）商务部新闻发言人何咏前在5日举行的例行新闻发布会上答记者问时表示，稀土等相关物项具有明显的军民两用属性，对其实施出口管制是国际通行做法。中国政府依法依规对两用物项相关出口许可申请进行审查，对符合规定的申请，中方将予以批准，促进便利合规贸易。", "content": "新华社北京6月5日电（记者谢希瑶）商务部新闻发言人何咏前在5日举行的例行新闻发布会上答记者问时表示，稀土等相关物项具有明显的军民两用属性，对其实施出口管制是国际通行做法。中国政府依法依规对两用物项相关出口许可申请进行审查，对符合规定的申请，中方将予以批准，促进便利合规贸易。", "image": "", "videoUrl": "", "source": "人民网国际", "sourceUrl": "http://world.people.com.cn/n1/2025/0605/c1002-40494861.html", "tags": ["经济", "人民网国际"], "translated": false}, {"id": "EVT-A10DEC25", "title": "外交部：中国愿继续与各方一道推动共建清洁、美丽、可持续的世界", "date": "2026-09-02", "category": "环境", "country": "中国", "region": "亚洲", "summary": "新华社北京6月5日电（记者袁睿）6月5日是世界环境日。外交部发言人林剑5日表示，中国一直是绿色发展的坚定行动派，也是全球绿色转型的重要贡献者。中国愿继续以“赋能型大国”的担当，与各方一道履行共同但有区别的责任，推动共建清洁、美丽、可持续的世界。 当日例行记者会上，有记者问：6月5日是世界环境日，有评论称，近年来中国引领全球绿色转型，在可再生能源开发等领域取得显著成就，并帮助其他发展中国家实施能源转", "content": "新华社北京6月5日电（记者袁睿）6月5日是世界环境日。外交部发言人林剑5日表示，中国一直是绿色发展的坚定行动派，也是全球绿色转型的重要贡献者。中国愿继续以“赋能型大国”的担当，与各方一道履行共同但有区别的责任，推动共建清洁、美丽、可持续的世界。 当日例行记者会上，有记者问：6月5日是世界环境日，有评论称，近年来中国引领全球绿色转型，在可再生能源开发等领域取得显著成就，并帮助其他发展中国家实施能源转型项目。请问发言人对此有何评论？ 林剑说，中国一直是绿色发展的坚定行动派。“绿水青山就是金山银山”理念提出20年来，中国在生态治理领域攻坚克难，妥善处理发展与保护的关系，成为全球能耗强度降低最快、空气质量改善最明显的国家之一，为世界贡献了四分之一的新增绿色面积，构建了全球最大、发展最快的可再生能源体系，建成了全球最大、最完整的新能源产业链。 林剑说，中国也是全球绿色转型的重要贡献者，与100多个国家和地区开展绿色能源项目合作，积极支持优质绿色技术和产品自由流通，为世界提供80%以上的光伏组件和70%的风电装备，推动全球风电和光伏发电项目平均度电成本分别累计下降超过60%和80%，让各国特别是广大发展中国家用得上、用得起、用得好。 “全球同此凉热，人类命运与共。”林剑表示，中国坚持生态优先、绿色发展，愿继续以“赋能型大国”的担当，与各方一道履行共同但有区别的责任，推动共建清洁、美丽、可持续的世界。", "image": "", "videoUrl": "", "source": "人民网国际", "sourceUrl": "http://world.people.com.cn/n1/2025/0605/c1002-40494859.html", "tags": ["环境", "人民网国际"], "translated": false}, {"id": "EVT-9A67AA53", "title": "来自神舟二十号的“太空问候”！中国航天员为世博会中国馆送祝福", "date": "2026-09-02", "category": "科技", "country": "中国", "region": "亚洲", "summary": "人民网东京6月5日电 （许可）2025大阪世博会中国馆开馆近两个月，目前已成为世博园内一道亮丽的风景线，吸引了无数参观者驻足。中国馆以“共同构建人与自然生命共同体——绿色发展的未来社会”为主题，通过一系列独具匠心的设计和互动体验，充分展现了中国在科技创新、绿色发展和文化传承等方面的最新成就。日前，三位神舟二十号航天员陈冬、陈中瑞、王杰，从中国空间站为2025大阪世博会中国馆送来了来自太空的祝福。 ", "content": "人民网东京6月5日电 （许可）2025大阪世博会中国馆开馆近两个月，目前已成为世博园内一道亮丽的风景线，吸引了无数参观者驻足。中国馆以“共同构建人与自然生命共同体——绿色发展的未来社会”为主题，通过一系列独具匠心的设计和互动体验，充分展现了中国在科技创新、绿色发展和文化传承等方面的最新成就。日前，三位神舟二十号航天员陈冬、陈中瑞、王杰，从中国空间站为2025大阪世博会中国馆送来了来自太空的祝福。 陈冬遥祝世博会中国馆圆满成功，并祝愿大家的梦想都能如星辰般闪耀，照亮前行之路。从古人“摘星”的梦想，到今朝触碰宇宙，人类探索未知的脚步从未停歇。让我们一起在逐梦圆梦的道路上奋力奔跑，勇敢前行！ 陈中瑞带着太空植物栽培实验成果喊话：守护地球不只是口号，更是行动！希望通过我们的努力，地球乃至整个宇宙会有更多的绿色，让未来社会更加生机勃勃，让孩子们梦想中的景象更加美丽。 王杰从太空向地面发来温暖问候，当看到眼前这颗蓝绿色的星球时，人类共同家园的意义也愈发清晰。中国空间站不仅是科技地标，更是全球航天合作的“太空客厅”。让我们同球共济、和合共生，携手描绘人类更加美好的未来！", "image": "", "videoUrl": "", "source": "人民网国际", "sourceUrl": "http://world.people.com.cn/n1/2025/0605/c1002-40494817.html", "tags": ["科技", "人民网国际"], "translated": false}, {"id": "EVT-4B91E18C", "title": "外交部回应美方宣布将对哈佛大学国际学生实行签证限制", "date": "2026-09-02", "category": "国际政治", "country": "中国", "region": "亚洲", "summary": "新华社北京6月5日电（记者袁睿、王慧慧）针对美国日前宣布将对哈佛大学国际学生实行签证限制，外交部发言人林剑5日在例行记者会上答问时表示，中美的教育合作是互利的。中方一贯反对将教育合作政治化，美方有关做法只会损害美国的形象和国际信誉。中方将坚定维护海外中国学生和学者的正当合法权益。", "content": "新华社北京6月5日电（记者袁睿、王慧慧）针对美国日前宣布将对哈佛大学国际学生实行签证限制，外交部发言人林剑5日在例行记者会上答问时表示，中美的教育合作是互利的。中方一贯反对将教育合作政治化，美方有关做法只会损害美国的形象和国际信誉。中方将坚定维护海外中国学生和学者的正当合法权益。", "image": "", "videoUrl": "", "source": "人民网国际", "sourceUrl": "http://world.people.com.cn/n1/2025/0605/c1002-40494811.html", "tags": ["国际政治", "人民网国际"], "translated": false}, {"id": "EVT-EDFD3998", "title": "中日气候变化问题专家交流会在东京举行", "date": "2026-09-02", "category": "科技", "country": "中国", "region": "亚洲", "summary": "6月3日，由日本笹川和平财团笹川日中友好基金主办的中日气候变化问题专家交流会在东京举行。人民网 蒋晓辰摄 人民网东京6月5日电（许可）由日本笹川和平财团笹川日中友好基金主办的中日气候变化问题专家交流会3日在东京举行。美中新视角基金会主席周志兴、笹川日中友好基金室长于展出席活动并致辞。清华大学能源环境经济研究所所长张希良、中诚信集团首席执行官马险峰、北京博雅智慧科技有限公司董事长陈雷、日本理化学研究", "content": "6月3日，由日本笹川和平财团笹川日中友好基金主办的中日气候变化问题专家交流会在东京举行。人民网 蒋晓辰摄 人民网东京6月5日电（许可）由日本笹川和平财团笹川日中友好基金主办的中日气候变化问题专家交流会3日在东京举行。美中新视角基金会主席周志兴、笹川日中友好基金室长于展出席活动并致辞。清华大学能源环境经济研究所所长张希良、中诚信集团首席执行官马险峰、北京博雅智慧科技有限公司董事长陈雷、日本理化学研究所北京代表处首席代表染野宪治以及日本环境省相关人士等十余名中日专家学者与会。 会上，两国专家围绕低碳经济转型、碳排放权交易市场的创新与发展、数字碳中和的创新与实践等内容展开热切讨论，共同聚焦全球气候变化挑战下的低碳转型议题，为深化两国合作贡献智慧。 与会专家热切交流。人民网 蒋晓辰摄 与会专家一致认为，在推动实现脱碳社会转型的进程中，中日两国具备广阔的合作空间和巨大的发展潜力。希望主办方继续举办此类活动，进一步推动两国在绿色低碳领域的理念互鉴与实践合作。 据悉，这是笹川日中友好基金第二次邀请中国环境问题专家访日。", "image": "", "videoUrl": "", "source": "人民网国际", "sourceUrl": "http://world.people.com.cn/n1/2025/0605/c1002-40494622.html", "tags": ["科技", "人民网国际"], "translated": false}, {"id": "EVT-04EB54AB", "title": "法国巴黎西岱大学孔院勇夺第24届“汉语桥”世界大学生中文比赛法国冠军", "date": "2026-09-02", "category": "体育", "country": "中国", "region": "亚洲", "summary": "人民网巴黎6月4日电 （记者何蒨） 5月30日至31日，由中国驻法大使馆主办、欧洲时报文化传媒集团承办的第24届“汉语桥”世界大学生中文比赛法国赛区决赛在巴黎举行，中国驻法使馆公使陈力、教育公参周家贵出席比赛并为获奖选手颁奖。 中国驻法使馆公使陈力、教育公参周家贵与比赛师生、评委合影。巴黎西岱大学孔子学院供图 来自巴黎西岱大学孔子学院、法国国立东方语言文化学院、诺欧商学院、波城孔子学院等9家单位的", "content": "人民网巴黎6月4日电 （记者何蒨） 5月30日至31日，由中国驻法大使馆主办、欧洲时报文化传媒集团承办的第24届“汉语桥”世界大学生中文比赛法国赛区决赛在巴黎举行，中国驻法使馆公使陈力、教育公参周家贵出席比赛并为获奖选手颁奖。 中国驻法使馆公使陈力、教育公参周家贵与比赛师生、评委合影。巴黎西岱大学孔子学院供图 来自巴黎西岱大学孔子学院、法国国立东方语言文化学院、诺欧商学院、波城孔子学院等9家单位的14名选手参加本届比赛，最终选出一等奖一名、二等奖两名、三等奖三名以及优秀奖和单项奖。来自西岱大学孔子学院的马爱乐（Mael Mohamed）以标准的中文发音和幽默的风格，得到评委一致好评，最终获得本届汉语桥世界大学生中文比赛法国赛区一等奖。 据记者了解，巴黎西岱大学孔子学院始终本着“以赛促教、以赛促学”的宗旨，每年认真选拔优秀学员参加比赛。今年中方院长刘萍亲自带队，提前半年开始部署，组织了孔院教学能力强、比赛经验丰富的牛莉、刘莉妮、李晔三名老师组成指导教师团队，在孔院400多名学员中遴选出两名中文水平高、有才艺潜力的学员马爱乐（Mael MOHAMED)、尼古拉(Nicolas MESA) 精心培育。三位指导老师充分发挥各自特长、优势，两位学生各项能力在短时间内获得突飞猛进的提升。 马爱乐快板表演《马爱乐，爱中华》。巴黎西岱大学孔子学院供图 中国驻法使馆公使陈力、教育公参周家贵与获奖师生亲切合影。巴黎西岱大学孔子学院供图 两名学员热爱中国文化，在学业、实习繁忙的情况下，挤出时间勤学苦练、认真备赛。马爱乐2023年曾作为交换生到武汉大学学习一年汉语。他以标准的发音、幽默的风格，绘声绘色地讲述了他从法国到武汉大学交换再到巴黎西岱大学孔院学习的中文寻梦之旅，一段精彩的快板更是点燃全场气氛，赢得满堂喝彩。尼古拉“世界和平，天下一家”的主题演讲，倡导当今青年携手为世界和平铺路搭桥，引起了全场共鸣，一曲中国古诗词《青玉案·元夕》改编的摇滚风贝斯弹唱，令人耳目一新，赢得了观众热烈的掌声。 经过中文笔试、主题演讲、才艺表演、评委即兴问答等几轮激烈角逐，马爱乐摘得第24届汉语桥世界大学生中文比赛法国赛区冠军桂冠，尼古拉荣获三等奖。巴黎西岱大学孔院获得2022、2023、2025年汉语桥法国赛区冠军，充分展示了卓越的教学水平，也极大提升了孔院品牌形象及影响力。", "image": "", "videoUrl": "", "source": "人民网国际", "sourceUrl": "http://world.people.com.cn/n1/2025/0605/c1002-40494621.html", "tags": ["体育", "人民网国际"], "translated": false}, {"id": "EVT-73424731", "title": "远景法国超级工厂投产 中法携手引领绿色能源转型", "date": "2026-09-02", "category": "科技", "country": "中国", "region": "欧洲", "summary": "人民网巴黎6月4日电 （记者于超凡）当地时间6月3日，电池科技企业远景动力位于法国杜埃的电池超级工厂正式投产，法国总统马克龙出席并致辞。 据悉，该工厂首期产能为10GWh，预计每年可为约20万辆电动汽车提供高性能动力电池，主要供应雷诺等车企。据此前消息，作为中法两国在绿色能源和先进制造领域合作的标志性成果，工厂到2030年将建成总产能24GWh，并具备扩容至40GWh的潜力。未来，该基地还将延伸至", "content": "人民网巴黎6月4日电 （记者于超凡）当地时间6月3日，电池科技企业远景动力位于法国杜埃的电池超级工厂正式投产，法国总统马克龙出席并致辞。 据悉，该工厂首期产能为10GWh，预计每年可为约20万辆电动汽车提供高性能动力电池，主要供应雷诺等车企。据此前消息，作为中法两国在绿色能源和先进制造领域合作的标志性成果，工厂到2030年将建成总产能24GWh，并具备扩容至40GWh的潜力。未来，该基地还将延伸至储能电池、智能充电设施与电池回收等全生命周期解决方案，构建起法国北部地区完整的绿色能源产业生态。 法国总统马克龙在致辞中表示，“在杜埃，我们正与远景共同书写法国绿色工业转型的新篇章。作为‘选择法国’战略下的旗舰项目，远景动力的落地投产是法国工业振兴与能源转型的象征性事件，它将改变整个地区的未来，影响下一代人的生活方式。” 仪式现场，马克龙总统手持象征旧能源时代的煤油灯与代表未来清洁能源的电池，寓意杜埃从传统能源中心走向清洁智能电力时代。他表示，感谢远景对法国绿色发展的贡献，强调法国亟须像远景这样兼具技术实力和全球视野的合作伙伴，共同引领欧洲能源转型和产业革新。 马克龙随后在社交媒体发文称，“有人说我们必须在经济增长与可持续发展之间作出选择，但我们决定两者兼得。有人质疑在法国本土制造电池的可能性，而远景杜埃超级工厂正是最有力的回应。我们不能止步不前，必须坚定地走在变革的前沿。” 远景动力目前在中国、日本、美国、英国、法国、西班牙等地布局13座电池制造基地。远景科技集团董事长张雷表示，法国超级工厂的投产为欧洲汽车产业的绿色转型注入新的活力。远景正以“人类命运共同体”为使命，以中国新能源技术助力全球可持续、繁荣发展。", "image": "", "videoUrl": "", "source": "人民网国际", "sourceUrl": "http://world.people.com.cn/n1/2025/0605/c1002-40494281.html", "tags": ["科技", "人民网国际"], "translated": false}, {"id": "EVT-368E07B6", "title": "2025第九届中国（印尼）出口品牌联展暨印尼雅加达国际工业联展开幕", "date": "2026-09-02", "category": "其他", "country": "中国", "region": "亚洲", "summary": "人民网雅加达6月4日电（记者李培松）6月4日，2025第九届中国（印尼）出口品牌联展暨印尼雅加达国际工业联展（简称“印尼展”）在雅加达展览中心开幕。 展会现场。活动主办方供图 印尼展聚焦印尼工业化4.0升级新需求，同期举办印尼工业装备及零部件展、印尼塑料印刷包装及食品加工设备展、印尼国际电力新能源展，展品覆盖印尼工业上下游全产业链中热门且极具潜力的15大品类，包括新能源、汽摩配、农业机械、塑料机械", "content": "人民网雅加达6月4日电（记者李培松）6月4日，2025第九届中国（印尼）出口品牌联展暨印尼雅加达国际工业联展（简称“印尼展”）在雅加达展览中心开幕。 展会现场。活动主办方供图 印尼展聚焦印尼工业化4.0升级新需求，同期举办印尼工业装备及零部件展、印尼塑料印刷包装及食品加工设备展、印尼国际电力新能源展，展品覆盖印尼工业上下游全产业链中热门且极具潜力的15大品类，包括新能源、汽摩配、农业机械、塑料机械与模具、包装与印刷机械等，全面展现中国“智”造在工业领域的综合实力。 展览面积达40,000平方米，不仅是中国在RCEP区域自主举办规模最大的工业题材展会，也是印尼最大工业供应链全产业展览，获得印尼工业部4.0委会员等政府部门以及印尼包装联合会、印尼工业机械协会等14家印尼工业领域商协会的鼎力支持，吸引了来自中国20个省以及印尼、日本等国1,000多家企业参展。展前预注册买家超70,000名，涵盖印尼及周边国家的专业采购商。 为更好助力中印尼两国工业领域的深度交流和合作，促进供需高效对接，2025年上半年，印尼展组委会联合印尼当地知名商协会在坤甸、望加锡、万隆等地举办多场路演活动，现场推介优质中国企业及产品，提升中国制造在东盟市场的影响力；同时，展会还与印尼最大的工业园区‌贾巴贝卡工业园区、印尼最大的国有钢铁集团克拉卡陶钢铁公司、三一重工印尼公司等企业达成展会考察、论坛活动等合作，进一步深化产业联动与技术交流。 组委会邀请印尼金属加工及铸造协会、印尼物流行业协会、印尼包装发展联合会等相关行业协会及其会员企业走进中国产业集聚地，深入了解中国制造业实力，提前发布采购需求、介绍市场潜力，促成多项前期合作意向。这一系列“走出去”与“请进来”的举措，有效搭建起中印尼产业对接的桥梁，为展会现场的高效洽谈奠定坚实基础。 印尼展“智能化”再次升级，通过自研“AI慧展”系统及AI眼镜，首次应用AI辅助行为和客户画像分析功能，及时提供外贸跟单建议，展商应用率已经达到了30%。 展会不仅为中国工业企业提供了一个展实力、拓市场的国际化平台，也为中印尼两国在工业制造、机械设备及智能制造等领域的深入合作搭建了重要桥梁。 印尼展由温州市人民政府主办，温州市商务局、米奥兰特国际会展承办，杭州市商务局、台州市商务局、嘉兴市商务局、金华市商务局联合主办，广东省商务厅指导，并得到吉林省商务厅、佛山市商务局、东莞市商务局、惠州市商务局的支持。", "image": "", "videoUrl": "", "source": "人民网国际", "sourceUrl": "http://world.people.com.cn/n1/2025/0605/c1002-40494292.html", "tags": ["其他", "人民网国际"], "translated": false}, {"id": "EVT-81EC4451", "title": "“赛考斯”挥别中国", "date": "2026-09-02", "category": "其他", "country": "中国", "region": "亚洲", "summary": "中新社北京9月1日电 (记者 曾玥)9月1日下午，美国友人“赛考斯”(本名罗纳德·萨科尔斯基)从北京启程返美。临别之际，他用“爱、家庭、朋友”三个词，概括此次中国之行。", "content": "中新社北京9月1日电 (记者 曾玥)9月1日下午，美国友人“赛考斯”(本名罗纳德·萨科尔斯基)从北京启程返美。临别之际，他用“爱、家庭、朋友”三个词，概括此次中国之行。", "image": "", "videoUrl": "", "
