name: 云端自动抓取

# 世界标准时间 (UTC) 17:00 / 21:00 / 03:00 / 09:00
# = 北京时间 01:00 / 05:00 / 11:00 / 17:00
# 与本地 WorkBuddy 定时任务（北京 07:00 / 23:00）完全错开
on:
  schedule:
    - cron: '0 17,21,3,9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装依赖
        run: pip install --quiet feedparser requests

      - name: 抓取并合并事件（云端跳过翻译，英文原文入库）
        env:
          SKIP_TRANSLATE: '1'
        run: python scraper/scraper.py

      - name: 构建静态页面
        run: python scraper/build.py

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "本次无新内容，跳过提交"
          else
            git commit -m "云端自动抓取: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M') 北京时间"
            git push
          fi
