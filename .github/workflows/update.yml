name: 云端自动抓取

# 世界标准时间 (UTC) 15:05 = 北京时间 23:05（每天一次）
on:
  schedule:
    - cron: '5 15 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# 与历史回填 workflow 互斥，防止两个任务同时写 events.json
concurrency:
  group: world-events-update
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      # 先装 Python 再跑脚本：原先 ensure 跑在 setup-python 之前，依赖 runner 自带的
      # python 别名；哪天镜像里只剩 python3 就会无声失败。
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 从分片重建工作副本（data/events.json 不入库，真源是 data/events/*.json）
        run: python scraper/shard_events.py ensure

      - name: 安装依赖
        run: pip install --quiet feedparser requests pytest

      - name: 抓取并合并事件（云端跳过机翻，英文原文入库）
        env:
          SKIP_TRANSLATE: '1'
          # 价值闸门：shadow = 只统计"如果开闸门会拦下什么"，不实际拦截、不改行为。
          # 观察几轮确认误杀率可接受后，再把这里改成 enforce 正式启用。
          INGEST_MODE: 'shadow'
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python scraper/scraper.py

      - name: LLM 翻译库中英文事件（flash 模型，配置见 scraper/llm_config.json）
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python scraper/translate_cloud.py

      - name: 字段级中文化（sources 标题/导语、时间线、description 的英文残留）
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python scraper/field_translate.py

      - name: 历史回填缺漏补翻（backfill_gaps 自动检测缺失并收敛清零）
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python scraper/backfill_gaps.py

      - name: 全文速览推进 30 条（云端抓外文源 + flash 模型生成）
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          ALL_SOURCES: '1'
        run: python scraper/full_summary_batch.py 30

      - name: 事件主图回填 60 条（抓来源页 og:image，全源）
        env:
          ALL_SOURCES: '1'
        run: python scraper/fill_images.py 60

      - name: 档案价值评分补跑（给新抓事件补 archiveValue / decision）
        # 抓取流程本身不评分，这里补跑保证评分覆盖跟上数据量。
        # continue-on-error：评分失败也绝不影响每日抓取入库这条主线。
        continue-on-error: true
        run: python scraper/rescore.py

      # 数据契约：自愈 → 契约测试 → 校验。放在 build 之前，
      # 坏数据进不了HTML、也进不了分片（split 里还有一次同样的自愈兜底）。
      - name: 数据契约自愈（类目/标签/日期，幂等）
        run: python scraper/normalize_data.py

      # 只阻断"数据契约"这一组：它不依赖网络与密钥，且正是防止 13 类回归的那道闸。
      - name: 数据契约测试（阻断）
        run: python -m pytest tests/test_data_contract.py -q

      # 其余既有测试先只报告：不清楚是否有依赖本地环境/密钥的用例，
      # 不让它们挡住每天的数据入库；确认稳定后把这一行改成阻断即可。
      - name: 其余单元测试（只报告，不阻断）
        continue-on-error: true
        run: python -m pytest tests/ -q

      - name: 数据契约校验（结构错误阻断发布）
        run: python scraper/validate.py --quiet

      - name: 构建静态页面
        run: python scraper/build.py

      - name: 分片写回（data/events/*.json 为入库真源，工作副本不入库）
        run: python scraper/shard_events.py split

      - name: 提交并推送（被拒自动合并重推，保住抓取成果）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "本次无新内容，跳过提交"
            exit 0
          fi
          git commit -m "云端自动抓取: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M') 北京时间"
          for i in 1 2 3 4; do
            if git push; then
              echo "PUSH_OK（第 ${i} 次尝试）"
              exit 0
            fi
            echo "push 被拒（第 ${i} 次），合并远程变更后重推…"
            git fetch origin main || true
            if ! git merge -X ours origin/main -m "merge: 保留抓取成果（本次抓取优先）"; then
              echo "merge 有冲突，冲突文件统一取本地版（保住本次抓取成果）"
              for f in $(git diff --name-only --diff-filter=U); do
                git checkout --ours "$f" 2>/dev/null || true
                git add "$f" 2>/dev/null || true
              done
              git commit -m "merge: 保留抓取成果（冲突取本地）" 2>/dev/null || true
            fi
            sleep 5
          done
          echo "PUSH_FAILED：4 次重试后仍失败"
          exit 1

      - name: 失败时创建 Issue 通知
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh issue list --repo ${{ github.repository }} --state open --search "自动化失败 in:title" --limit 1 --json number --jq 'length')
          if [ "${EXISTING}" = "0" ]; then
            gh issue create --repo ${{ github.repository }} \
              --title "自动化失败: ${{ github.workflow }} $(TZ=Asia/Shanghai date '+%m-%d %H:%M') 北京时间" \
              --body "云端自动任务失败了，请检查日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || echo "issue create failed"
          else
            echo "已有未关闭的失败 Issue，跳过重复创建"
          fi

      - name: 成功时关闭旧的失败 Issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --repo ${{ github.repository }} --state open --search "自动化失败 in:title" --json number --jq '.[].number' | while read n; do
            gh issue close "$n" --repo ${{ github.repository }} --comment "本次运行已成功，自动关闭。" || true
          done
