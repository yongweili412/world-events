name: 证据补证（弱证据事件补抓独立来源）

# 背景：84.7%（26,136 条）历史事件的 sources 只有维基月度存档页，证据等级 weak，
# 导致近 7 成事件只能判 REVIEW——不是没价值，是没有证据能验证价值。
# 本任务回到维基逐日页重新解析，把 <ref> 里的真实报道链接补进 sources。
#
# 注意：必须云端运行，本机访问不了 en.wikipedia.org（SSL 被拦）。
# 每月跑完增量保存；命中率会打在日志里，据此决定是否扩大范围。

on:
  schedule:
    - cron: '5 8 * * *'   # = 北京 16:05，每天 1 批（每批 2 个月）
                          # 错开抓取(23:05)、年表回填(02:00/14:00)、逐日回填(07:05)
  workflow_dispatch:
    inputs:
      months:
        description: '年月列表（空格分隔，如 "2020-03 2021-01"；留空=auto 模式）'
        required: false
        default: ''
      count:
        description: 'auto 模式处理月份数'
        required: false
        default: '2'

permissions:
  contents: write

concurrency:
  group: world-events-update
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 从分片重建工作副本（data/events.json 不入库，真源是 data/events/*.json）
        run: python scraper/shard_events.py ensure

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装依赖
        run: pip install --quiet feedparser requests

      - name: 补抓独立来源（维基逐日页 <ref> → 事件 sources）
        # 无需 LLM_API_KEY：补证是纯解析+匹配，不调用模型
        run: |
          if [ -z "${{ github.event.inputs.months }}" ]; then
            python scraper/enrich_sources.py --auto ${{ github.event.inputs.count || '2' }}
          else
            python scraper/enrich_sources.py --months ${{ github.event.inputs.months }}
          fi

      - name: 校验数据完整性（事件数不减少 / id 唯一）
        run: python scraper/validate.py || echo "⚠️ validate 有告警（不阻断补证结果）"

      - name: 分片写回（data/events/*.json 为入库真源，工作副本不入库）
        run: python scraper/shard_events.py split

      - name: 提交并推送（被拒自动合并重推，保住补证成果）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "本次无新内容，跳过提交"
            exit 0
          fi
          git commit -m "证据补证: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M') 北京时间"
          for i in 1 2 3 4; do
            if git push; then
              echo "PUSH_OK（第 ${i} 次尝试）"
              exit 0
            fi
            echo "push 被拒（第 ${i} 次），合并远程变更后重推…"
            git fetch origin main || true
            if ! git merge -X ours origin/main -m "merge: 保留补证成果（本次补证优先）"; then
              echo "merge 有冲突，冲突文件统一取本地版（保住本次补证成果）"
              for f in $(git diff --name-only --diff-filter=U); do
                git checkout --ours "$f" 2>/dev/null || true
                git add "$f" 2>/dev/null || true
              done
              git commit -m "merge: 保留补证成果（冲突取本地）" 2>/dev/null || true
            fi
            sleep 5
          done
          echo "PUSH_FAILED：4 次重试后仍失败"
          exit 1
