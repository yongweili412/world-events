name: 历史回填（1997-2025 大事年表）

# 北京时间 02:00 / 14:00 各跑一次，与云端日常抓取（1/5/11/17 点）、
# 本地 AI 精修任务（7/23 点）完全错开；每次自动回填 2 个年份，
# 全部 29 个年份约 15 次运行（约一周）完成。
on:
  schedule:
    - cron: '0 18,6 * * *'
  workflow_dispatch:
    inputs:
      years:
        description: '指定年份（空格分隔，如 "2001 2003"；留空则自动取下 2 个未完成年份）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: world-events-update
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装依赖
        run: pip install --quiet feedparser requests

      - name: 回填历史大事（抓取维基年表 → LLM 翻译 → 入库）
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python scraper/backfill_history.py ${{ github.event.inputs.years || 'auto' }}

      - name: 构建静态页面
        run: python scraper/build.py

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "本次无新内容，跳过提交"
          else
            git commit -m "历史回填: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M') 北京时间"
            git push
          fi
