name: 逐日存档回填（重点年份细节）

# 抓维基百科 Portal:Current_events 逐日页（每天 5-20 条当时新闻），
# 比年度大事年表细得多。用法：
#   months 填 "2008-01 2008-02" 指定月份；留空则 auto 模式按 count 取未完成月份。
#   auto 模式的目标年份范围见 data/backfill_daily_targets.json（跑完自动停止）。
# cron 每天北京 04:00 自动推进 per_run 个月（公开仓库 Actions 免费，无额度约束）。
# 全部 LLM 环节统一 flash 模型（配置见 scraper/llm_config.json）。
on:
  schedule:
    - cron: '0 20 * * *'   # = 北京 04:00，避开云端抓取（1/5/11/17 点）与年表回填（2/14 点）
  workflow_dispatch:
    inputs:
      months:
        description: '年月列表（空格分隔，如 "2008-01 2008-02"；留空=auto 模式）'
        required: false
        default: ''
      count:
        description: 'auto 模式处理月份数'
        required: false
        default: '3'

permissions:
  contents: write
  issues: write

concurrency:
  group: world-events-update
  cancel-in-progress: false

jobs:
  daily-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装依赖
        run: pip install --quiet feedparser requests

      - name: 逐日存档回填（抓取维基逐日页 → flash 模型翻译 → 入库）
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          if [ -z "${{ github.event.inputs.months }}" ]; then
            python scraper/backfill_daily.py auto ${{ github.event.inputs.count || '3' }}
          else
            python scraper/backfill_daily.py ${{ github.event.inputs.months }}
          fi

      - name: 构建静态页面
        run: python scraper/build.py

      - name: 提交并推送（被拒自动合并重推，保住长任务成果）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "本次无新内容，跳过提交"
            exit 0
          fi
          git commit -m "逐日存档回填: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M') 北京时间"
          for i in 1 2 3 4; do
            if git push; then
              echo "PUSH_OK（第 ${i} 次尝试）"
              exit 0
            fi
            echo "push 被拒（第 ${i} 次），合并远程变更后重推…"
            git fetch origin main || true
            if ! git merge -X ours origin/main -m "merge: 保留回填成果（本次回填优先）"; then
              echo "merge 有冲突，冲突文件统一取本地版（保住本次回填成果）"
              for f in $(git diff --name-only --diff-filter=U); do
                git checkout --ours "$f" 2>/dev/null || true
                git add "$f" 2>/dev/null || true
              done
              git commit -m "merge: 保留回填成果（冲突取本地）" 2>/dev/null || true
            fi
            sleep 5
          done
          echo "PUSH_FAILED：4 次重试后仍失败"
          exit 1

      - name: 失败时创建 Issue 通知
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh issue list --repo ${{ github.repository }} --state open --search "自动化失败 in:title" --limit 1 --json number --jq 'length')
          if [ "${EXISTING}" = "0" ]; then
            gh issue create --repo ${{ github.repository }} \
              --title "自动化失败: 逐日存档回填 $(TZ=Asia/Shanghai date '+%m-%d %H:%M') 北京时间" \
              --body "逐日存档回填任务失败，请检查日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || echo "issue create failed"
          else
            echo "已有未关闭的失败 Issue，跳过重复创建"
          fi

      - name: 成功时关闭旧的失败 Issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --repo ${{ github.repository }} --state open --search "自动化失败 in:title" --json number --jq '.[].number' | while read n; do
            gh issue close "$n" --repo ${{ github.repository }} --comment "本次运行已成功，自动关闭。" || true
          done
