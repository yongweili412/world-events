name: 逐日存档回填（重点年份细节）

# 抓维基百科 Portal:Current_events 逐日页（每天 5-20 条当时新闻），
# 比年度大事年表细得多。用法：
#   months 填 "2008-01 2008-02" 指定月份；留空则 auto 模式按 count 取未完成月份。
#   auto 模式的目标年份范围见 data/backfill_daily_targets.json（跑完自动停止）。
# cron 每天自动推进 per_run 个月（值见 data/backfill_daily_targets.json，公开仓库 Actions 免费）。
# 全部 LLM 环节统一 flash 模型（配置见 scraper/llm_config.json）。
on:
  schedule:
    - cron: '5 23 * * *'   # = 北京 07:05，每天 1 批（月份数读 per_run）
                           # 错开抓取(1/5/11/17点)与年表回填(2/14点)
                           # 免费 flash 账户限流约 2-3 次/分钟，串行是速度上限
  workflow_dispatch:
    inputs:
      months:
        description: '年月列表（空格分隔，如 "2008-01 2008-02"；留空=auto 模式）'
        required: false
        default: ''
      count:
        description: 'auto 模式处理月份数（留空=读 data/backfill_daily_targets.json 的 per_run）'
        required: false
        default: ''

permissions:
  contents: write
  issues: write

concurrency:
  group: world-events-update
  cancel-in-progress: false

jobs:
  daily-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 从分片重建工作副本（data/events.json 不入库，真源是 data/events/*.json）
        run: python scraper/shard_events.py ensure

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装依赖
        run: pip install --quiet feedparser requests

      - name: 逐日存档回填（抓取维基逐日页 → flash 模型翻译 → 入库）
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          if [ -z "${{ github.event.inputs.months }}" ]; then
            # 每批月份数：手动输入优先，否则读 data/backfill_daily_targets.json 的 per_run
            # （此前这里硬编码 '3'，导致改 JSON 的 per_run 不生效——2026-11-06 修复）
            N="${{ github.event.inputs.count }}"
            if [ -z "$N" ]; then
              N=$(python -c "import json;print(json.load(open('data/backfill_daily_targets.json',encoding='utf-8')).get('per_run',3))")
            fi
            echo "本次 auto 处理月份数: $N"
            python scraper/backfill_daily.py auto "$N"
          else
            python scraper/backfill_daily.py ${{ github.event.inputs.months }}
          fi

      - name: 产出验收（各月条数达标检查，不达标即告警失败）
        run: python scraper/verify_daily_backfill.py

      - name: 档案价值评分补跑（新增事件必须补分，否则评分覆盖出现缺口）
        # 2026-10-10 修复：本工作流原先漏了这一步，导致 2025-01/02/03 共 1838 条
        # 回填事件入库后无 archiveValue。补分只补未评分的，可安全重跑。
        continue-on-error: true
        run: python scraper/rescore.py

      - name: 构建静态页面
        run: python scraper/build.py

      - name: 分片写回（data/events/*.json 为入库真源，工作副本不入库）
        run: python scraper/shard_events.py split

      - name: 提交并推送（被拒自动合并重推，保住长任务成果）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "本次无新内容，跳过提交"
            exit 0
          fi
          git commit -m "逐日存档回填: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M') 北京时间"
          for i in 1 2 3 4; do
            if git push; then
              echo "PUSH_OK（第 ${i} 次尝试）"
              exit 0
            fi
            echo "push 被拒（第 ${i} 次），合并远程变更后重推…"
            git fetch origin main || true
            # P1-5: 禁用 -X ours（对 JSON 分片等于整文件取本地，会静默丢事件）。
            # 改为「普通 merge → 按事件 id 并集合并冲突分片 → split 重建」。
            git merge --no-commit --no-ff origin/main 2>/dev/null || true
            python scraper/merge_shards.py
            python scraper/shard_events.py split
            # 非分片冲突（若有）保留本轮成果；分片冲突已由 merge_shards 解决。
            for f in $(git diff --name-only --diff-filter=U); do
              case "$f" in
                data/events/*.json) : ;;                 # 已并集合并，跳过
                *) git checkout --ours "$f" 2>/dev/null || true; git add "$f" 2>/dev/null || true ;;
              esac
            done
            git add -A
            git commit -m "merge: 按事件id并集合并分片（不丢远端成果）" 2>/dev/null || true
            sleep 5
          done
          echo "PUSH_FAILED：4 次重试后仍失败"
          exit 1

      - name: 失败时创建 Issue 通知
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh issue list --repo ${{ github.repository }} --state open --search "自动化失败 in:title" --limit 1 --json number --jq 'length')
          if [ "${EXISTING}" = "0" ]; then
            gh issue create --repo ${{ github.repository }} \
              --title "自动化失败: 逐日存档回填 $(TZ=Asia/Shanghai date '+%m-%d %H:%M') 北京时间" \
              --body "逐日存档回填任务失败，请检查日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || echo "issue create failed"
          else
            echo "已有未关闭的失败 Issue，跳过重复创建"
          fi

      - name: 成功时关闭旧的失败 Issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --repo ${{ github.repository }} --state open --search "自动化失败 in:title" --json number --jq '.[].number' | while read n; do
            gh issue close "$n" --repo ${{ github.repository }} --comment "本次运行已成功，自动关闭。" || true
          done
