name: 部署站点（GitHub Pages）

# 为什么需要这个工作流：
#   data/events.js 是构建产物（70MB+），已加入 .gitignore 不入库，避免撑爆 git 历史。
#   本工作流在部署时运行 build.py 现场生成它，再发布到 Pages——站点照常可用，
#   但 git 仓库里不再存放这个巨型生成物。
#
# 触发说明（重要）：
#   - push：本地/PAT 推送会触发；但云端工作流用 GITHUB_TOKEN 推送【不会】触发 push 工作流
#     （GitHub 防死循环机制），所以云端数据更新不会即时触发部署，靠 schedule 兜底。
#   - schedule：每 6 小时兜底，防止漏触发。
#   - workflow_dispatch：手动触发。

on:
  push:
    branches: [main]
  # 2026-11-10：移除 workflow_run 即时触发。
  # 原因：dist 达 386MB / 约 1.18 万文件，Pages 单次同步经常超过 action 的
  # 600 秒硬上限（timeout 参数被 GitHub 强制压到最大 600000ms，设更大也无效），
  # 而数据工作流一天成功十几次，每次都触发一次全量同步 → 近 12 次部署 2 次失败。
  # 改为只靠 schedule 每 6 小时批量部署 + push 触发：牺牲最多 6 小时新鲜度，
  # 换取部署次数减少一个量级、排队冲突显著下降。配合下方"失败自动重试一次"。
  schedule:
    - cron: '40 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 从分片重建工作副本（data/events.json 不入库，真源是 data/events/*.json）
        run: python scraper/shard_events.py ensure

      # 部署不写库，但要有同样的底线：自愈 + 校验通过才发布。
      # 自愈只改工作副本，不回写分片（分片的清洗由 update 的 split 负责）。
      - name: 数据契约自愈 + 校验
        run: |
          python scraper/normalize_data.py
          python scraper/validate.py --quiet

      - name: 生成静态站点（index-lite + 月分片 + robots/sitemap）
        run: python scraper/build.py

      - name: 组装发布目录
        run: |
          mkdir -p dist/data
          # 只拷贝站点正式页面；演示页 preview.html 已于 2026-11-06 从仓库移除
          cp index.html country.html event.html map.html data-about.html dist/ 2>/dev/null || true
          cp app.js style.css dist/ 2>/dev/null || true
          if [ -d assets ]; then cp -r assets dist/; fi
          cp archive-*.html dist/ || true
          cp LICENSE.md feed.xml dist/ 2>/dev/null || true
          # 静态详情页 e/：sitemap 收录了这些 URL，必须一并发布，否则全部 404。
          # 2026-11-06 修复：此前漏拷 e/，导致 7357 个 SEO 页面线上返回 GitHub Pages 404。
          mkdir -p dist/e
          cp e/*.html dist/e/
          # 轻量索引 + 单月分片：详情页/搜索/地图按需加载（替代原 114MB 的 events.js）
          cp data/index-lite.json dist/data/index-lite.json
          mkdir -p dist/data/m
          cp data/m/*.json dist/data/m/
          # SEO：让搜索引擎能抓到站点
          cp robots.txt sitemap.xml dist/ 2>/dev/null || true
          # admin.html 不再部署：28.5MB、无鉴权、对访客零价值（robots.txt 已 Disallow）
          echo "--- 发布目录概览 ---"
          ls -1 dist | head -18
          echo "归档页数量: $(ls -1 dist/archive-*.html 2>/dev/null | wc -l)"
          echo "静态详情页数量: $(ls -1 dist/e/*.html 2>/dev/null | wc -l)"
          echo "月分片数量: $(ls -1 dist/data/m/*.json 2>/dev/null | wc -l)"
          du -sh dist
          # 部署自检：sitemap 里的静态页 URL 必须真的存在于产物中，缺则直接失败。
          # 抽查首个与末个静态详情页，避免"部署成功但页面 404"再次发生。
          first_e=$(ls -1 dist/e/*.html 2>/dev/null | head -1)
          if [ -z "$first_e" ]; then
            echo "::error::dist/e 为空，静态详情页未发布（sitemap 会全部 404）"
            exit 1
          fi
          sitemap_e=$(grep -c "e/evt_" dist/sitemap.xml 2>/dev/null || echo 0)
          dist_e=$(ls -1 dist/e/*.html 2>/dev/null | wc -l)
          echo "sitemap 静态页 URL: $sitemap_e | 已发布静态页: $dist_e"
          if [ "$dist_e" -lt "$sitemap_e" ]; then
            echo "::error::静态详情页数量少于 sitemap 收录数，会有一部分 404"
            exit 1
          fi

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        # 首次失败不中断，交给下一步重试（Pages 同步超时是瞬时拥塞，重试常能过）
        continue-on-error: true
        with:
          # 单位是毫秒。实测 GitHub 会把超过 600000 的值强制压回 600000
          # （日志：timeout set to the maximum of 600000 milliseconds），
          # 所以直接写 600000（10 分钟），不再用 1800000 造成误解。
          timeout: 600000

      - name: 部署重试（首次超时/失败后）
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000

      - name: 两次都失败则标记本次部署失败
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: |
          echo "::error::Pages 部署两次均失败，请检查是否为发布体积/文件数超限（当前 dist 约 386MB / 1.18 万文件）"
          exit 1
