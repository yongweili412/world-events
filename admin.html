<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23185FA5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='10'/%3E%3Cline x1='2' y1='12' x2='22' y2='12'/%3E%3Cpath d='M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z'/%3E%3C/svg%3E">
  <title>管理后台 - 全球大事记</title>
  <link rel="stylesheet" href="./style.css?v=6">
</head>
<body>

<!-- 导航栏 -->
<nav class="navbar">
  <div class="nav-inner">
    <a href="./index.html" class="nav-logo"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg> 全球大事记</a>
    <div class="nav-links">
      <a href="./index.html">时间线</a>
      <a href="./admin.html" class="active">管理后台</a>
    </div>
  </div>
</nav>

<div class="container">

  <div class="page-header">
    <h1 class="page-title">管理后台</h1>
    <p class="page-subtitle">手动添加事件 · 导出数据 · 管理存档</p>
  </div>

  <!-- 添加事件表单 -->
  <div style="max-width:720px;margin-bottom:40px">
    <h2 style="font-size:17px;font-weight:600;margin-bottom:16px;color:var(--text)"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg> 添加新事件</h2>
    <form id="event-form" class="admin-form">
      <div class="form-group">
        <label class="form-label">事件标题 *</label>
        <input type="text" name="title" class="form-input" placeholder="例如：日本突发7.1级地震" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">日期 *</label>
          <input type="date" name="date" class="form-input" id="form-date" required>
        </div>
        <div class="form-group">
          <label class="form-label">分类 *</label>
          <select name="category" class="form-input" required>
            <option value="">请选择</option>
            <option>自然灾害</option>
            <option>国际政治</option>
            <option>科技</option>
            <option>经济</option>
            <option>环境</option>
            <option>体育</option>
            <option>社会</option>
            <option>其他</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">国家/地区</label>
          <input type="text" name="country" class="form-input" placeholder="例如：日本">
        </div>
        <div class="form-group">
          <label class="form-label">大洲/地区</label>
          <select name="region" class="form-input">
            <option value="">请选择</option>
            <option>亚洲</option>
            <option>欧洲</option>
            <option>北美洲</option>
            <option>南美洲</option>
            <option>非洲</option>
            <option>大洋洲</option>
            <option>其他</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">摘要（一句话说明）</label>
        <input type="text" name="summary" class="form-input" placeholder="简短描述，显示在时间线上">
      </div>
      <div class="form-group">
        <label class="form-label">正文内容</label>
        <textarea name="content" class="form-input form-textarea" placeholder="事件的详细描述，支持换行"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">封面图片链接</label>
        <input type="text" name="image" class="form-input" placeholder="https://... 留空则无图片">
      </div>
      <div class="form-group">
        <label class="form-label">视频链接（可选）</label>
        <input type="text" name="videoUrl" class="form-input" placeholder="YouTube 或 Bilibili 链接">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">来源（媒体名称）</label>
          <input type="text" name="source" class="form-input" placeholder="例如：BBC、新华社">
        </div>
        <div class="form-group">
          <label class="form-label">来源链接</label>
          <input type="text" name="sourceUrl" class="form-input" placeholder="https://...">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">标签（用逗号分隔）</label>
        <input type="text" name="tags" class="form-input" placeholder="例如：地震,日本,自然灾害">
      </div>
      <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap">
        <button type="submit" class="btn btn-primary"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> 保存事件</button>
        <a href="./index.html" class="btn btn-secondary">查看时间线 →</a>
      </div>
    </form>
  </div>

  <!-- 已有事件列表 -->
  <div>
    <h2 style="font-size:17px;font-weight:600;margin-bottom:16px;color:var(--text)"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="15" y2="16"/></svg> 已收录事件</h2>
    <div id="admin-list">
<!-- ADMINLIST_START -->

<!-- ADMINLIST_END -->
    </div>
  </div>

  <!-- 数据导出说明 -->
  <div style="margin-top:32px;padding:16px 20px;background:var(--primary-light);border-radius:var(--radius);font-size:13px;color:var(--text-secondary);line-height:1.8">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg> <strong>关于数据存储</strong><br>
    当前版本使用浏览器本地下载方式保存数据。<br>
    点击"保存事件"后，会自动下载最新的 <code>events.json</code> 文件，请将其放入 <code>data/</code> 文件夹覆盖原文件。<br>
    后续版本将支持自动抓取和数据库存储。
  </div>

</div>

<!-- 页脚 -->
<div class="footer">
  全球大事记 · 管理后台
</div>

<!-- EMBED_EVENTS_START -->

<!-- EMBED_EVENTS_END -->
<script src="./app.js?v=9"></script>
<script>
  // 自动填今天日期
  document.getElementById('form-date').value = new Date().toISOString().slice(0,10);
</script>
</body>
</html>
